  <script>
    const attachBtn = document.getElementById('attachBtn');
    const attachMenu = document.getElementById('attachMenu');
    const imageUploadBtn = document.getElementById('imageUploadBtn');
    const chatInput = document.getElementById('chatInput');

    // Create a hidden file input for images
    const hiddenFile = document.createElement('input');
    hiddenFile.type = 'file';
    hiddenFile.accept = 'image/*';
    hiddenFile.multiple = true;
    hiddenFile.style.display = 'none';
    document.body.appendChild(hiddenFile);

    // Toggle menu visibility and + button animation
    attachBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const isOpen = attachMenu.classList.contains('open');
      attachMenu.classList.toggle('open', !isOpen);
      attachBtn.classList.toggle('open', !isOpen);
    });

    // Trigger file input when image upload button is clicked and reset + button position
    imageUploadBtn.addEventListener('click', (e) => {
      e.preventDefault();
      hiddenFile.click();
      attachMenu.classList.remove('open');
      attachBtn.classList.remove('open');
    });

    // Handle file selection
    hiddenFile.addEventListener('change', (ev) => {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      chatInput.value = chatInput.value + (chatInput.value ? '\n' : '') + '[Attached: ' + file.name + ']';
    });

    // Close menu when clicking outside and reset + button position
    document.addEventListener('click', (e) => {
      if (!attachBtn.contains(e.target) && !attachMenu.contains(e.target)) {
        attachMenu.classList.remove('open');
        attachBtn.classList.remove('open');
      }
    });

    async function getMemoryContext() {
  try {
    const q = query(collection(db, "chatMemory"), orderBy("timestamp", "desc"), limit(3));
    const snapshot = await getDocs(q);
    return snapshot.docs.map(doc => {
      const data = doc.data();
      return `Intent: ${data.intent}\nSupreme AI: ${data.ai}`;
    }).join("\n\n");
  } catch (e) {
    console.error("Error fetching memory context:", e);
    return "";
  }
}

async function isIntentMeaningfulWithHuggingFace(userInput, intent) {
  const hf_apiKey = "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"; // Same key
  const model = "google/flan-t5-xxl";

  try {
    const prompt = `User said: "${userInput}"\n\nIntent: "${intent}"\n\nIs this intent meaningful and accurate for the user's message? Just say YES or NO.`;

    const res = await fetch(`https://api-inference.huggingface.co/models/${model}`, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${hf_apiKey}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ inputs: prompt, options: { wait_for_model: true } })
    });

    const data = await res.json();
    let output = Array.isArray(data) ? data[0]?.generated_text : data?.generated_text;
    output = (output || "").trim().toLowerCase();

    return output.includes("yes");
  } catch {
    return true;
  }
}


 async function summarizeIntentWithHuggingFace(userInput, intent) {
  const hf_apiKey = "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";
  const models = [
    "google/flan-t5-xxl",
    "facebook/bart-large-cnn",
    "google/t5-large"
  ];

  const prompt = `User said: "${userInput}"\n\nInterpreted Intent: "${intent}"\n\nSummarize this intent into a short 3-6 word label.`;

  // Step 1: sab models ko parallel call karna
  const fetches = models.map(model =>
    fetch(`https://api-inference.huggingface.co/models/${model}`, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${hf_apiKey}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ inputs: prompt, options: { wait_for_model: true } })
    })
      .then(res => res.json())
      .then(data => {
        let output = Array.isArray(data) ? data[0]?.generated_text : data?.generated_text;
        return (output || "").trim().replace(/[".]/g, "");
      })
      .catch(() => null)
  );

  const results = await Promise.allSettled(fetches);
  const validResponses = results
    .filter(r => r.status === "fulfilled" && r.value)
    .map(r => r.value);

  if (validResponses.length === 0) {
    return intent; // fallback
  }

  if (validResponses.length === 1) {
    return validResponses[0]; // single model ka answer
  }

  // Step 2: agar multiple models ka result aaya, to Flan-T5 se best summary banwana
  const combinePrompt = `
We got multiple model summaries for the same intent:

${validResponses.map((res, i) => `Option ${i + 1}: ${res}`).join("\n")}

Now combine them and return the **best, most accurate, single 3-6 word intent label**.
Do not add extra text. Only output the final label.
`;

  try {
    const res = await fetch("https://api-inference.huggingface.co/models/google/flan-t5-xxl", {
      method: "POST",
      headers: {
        Authorization: `Bearer ${hf_apiKey}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ inputs: combinePrompt, options: { wait_for_model: true } })
    });

    const data = await res.json();
    let finalOutput = Array.isArray(data) ? data[0]?.generated_text : data?.generated_text;
    return (finalOutput || validResponses[0]).trim().replace(/[".]/g, "");
  } catch {
    // fallback agar combine call fail ho gaya
    return validResponses[0];
  }
}

   async function saveToSmartMemory(userInput, aiReply) {
  let intent = await smartAnalyzeWithHuggingFace(userInput);
  const isValid = await isIntentMeaningfulWithHuggingFace(userInput, intent);

  if (!isValid) intent = userInput;
  const label = await summarizeIntentWithHuggingFace(userInput, intent);

  const memory = JSON.parse(localStorage.getItem("chatMemory") || "[]");

  memory.push({
    user: userInput,
    intent: label,
    ai: aiReply
  });

  localStorage.setItem("chatMemory", JSON.stringify(memory));
}


    async function detectEmojiSmart(userInput) {
  const hf_apiKey = "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";
  const models = [
    { name: "ashish-001/tweet-emoji-predictor", priority: 3 }, // sabse jyada priority
    { name: "KoalaAI/Emoji-Suggester", priority: 2 },
     { name: "jakubvonasek/text2emoji", priority: 1 } // add later jab HF pe available ho
  ];

  const prompt = `
You're an AI assistant that adds relevant emojis based on the user's message.
Analyze the user's tone, emotion, and purpose, then return ONLY emojis (one or multiple).
Do NOT add any text or explanation, just return the emojis.

User message: "${userInput}"
`;

  // 1. Fetch results from all models
  const fetches = models.map(m =>
    fetch(`https://api-inference.huggingface.co/models/${m.name}`, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${hf_apiKey}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ inputs: prompt, options: { wait_for_model: true } })
    })
      .then(res => res.json())
      .then(data => {
        let output = Array.isArray(data) ? data[0]?.generated_text : data?.generated_text;
        if (!output) return null;

        // Extract emojis only
        const emojis = output.match(/\p{Emoji_Presentation}|\p{Emoji}\uFE0F/gu);
        return { model: m.name, priority: m.priority, emojis: emojis || [] };
      })
      .catch(() => null)
  );

  const results = await Promise.allSettled(fetches);
  const valid = results
    .filter(r => r.status === "fulfilled" && r.value)
    .map(r => r.value);

  if (valid.length === 0) {
    return "😊"; // fallback
  }

  // 2. Voting system + priority weight
  const voteMap = {};
  valid.forEach(res => {

  ];

  const formalityModel = "s-nlp/roberta-base-formality-ranker";                           // formal vs informal
  const sentimentModel = "cardiffnlp/twitter-roberta-base-sentiment-latest";              // pos/neu/neg (social text)

  // quick deterministic guard: technical/code-y text => no emoji
  const technicalRe = /(```|`[^`]+`|<[^>]+>|http(s)?:\/\/|\b(npm|git|yarn|pip|SELECT|INSERT|stacktrace|Exception)\b)/i;
  if (technicalRe.test(userInput)) return false;

  // ---- helpers ----
  const hf = (model, body) =>
    fetch(`https://api-inference.huggingface.co/models/${model}`, {
      method: "POST",
      headers: { Authorization: `Bearer ${hf_apiKey}`, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(r => r.json());

  const getLabelScore = (out, wanted) => {
    // supports both zero-shot (labels/scores) and text-classification (array of {label,score})
    if (Array.isArray(out)) {
      const hit = out.find(x => (x.label || "").toLowerCase() === wanted.toLowerCase());
      return hit ? hit.score : 0;
    }
    if (out && Array.isArray(out.labels) && Array.isArray(out.scores)) {
      const idx = out.labels.map(l => l.toLowerCase()).indexOf(wanted.toLowerCase());
      return idx >= 0 ? out.scores[idx] : 0;
    }
    return 0;
  };

  // ---- 1) NLI zero-shot: "emoji appropriate" vs "emoji inappropriate"
  const nliPayload = (text) => ({
    inputs: text,
    parameters: {
      candidate_labels: ["emoji appropriate", "emoji inappropriate"],
      hypothesis_template: "This message is {}.",
      multi_label: false
    },
    options: { wait_for_model: true }
  });

  const nliFetches = nliModels.map(m =>
    hf(m.name, nliPayload(userInput))
      .then(out => {
        const yes = getLabelScore(out, "emoji appropriate");
        const no  = getLabelScore(out, "emoji inappropriate");
        const margin = (yes - no);           // >0 means leaning YES
        return { model: m.name, weight: m.weight, yes, no, margin };
      })
      .catch(() => null)
  );

  // ---- 2) Formality & Sentiment
  const formalityFetch = hf(formalityModel, { inputs: userInput, options: { wait_for_model: true } })
    .catch(() => null);
  const sentimentFetch = hf(sentimentModel, { inputs: userInput, options: { wait_for_model: true } })
    .catch(() => null);

  const [nliResultsRaw, formalityOut, sentimentOut] = await Promise.all([
    Promise.allSettled(nliFetches),
    formalityFetch, sentimentFetch
  ]);

  const nli = nliResultsRaw
    .filter(r => r.status === "fulfilled" && r.value)
    .map(r => r.value);

  // If everything failed, be conservative:
  if (nli.length === 0 && !formalityOut && !sentimentOut) return false;

  // Weighted NLI decision
  const weightedYes = nli.reduce((s, r) => s + r.yes * r.weight, 0);
  const weightedNo  = nli.reduce((s, r) => s + r.no  * r.weight, 0);
  const nliConfidence = weightedYes + weightedNo > 0 ? weightedYes / (weightedYes + weightedNo) : 0.5;

  // Formality (prefer no emoji if clearly formal)
  const pFormal   = getLabelScore(formalityOut, "formal");
  const pInformal = getLabelScore(formalityOut, "informal");

  const pPos = getLabelScore(sentimentOut, "positive");
  const pNeu = getLabelScore(sentimentOut, "neutral");
  const pNeg = getLabelScore(sentimentOut, "negative");

  // ---- Decision logic ----
  let useEmoji = nliConfidence >= 0.55; // base

  // If very formal AND neutral → avoid emojis
  if (pFormal >= 0.70 && pNeu >= 0.60) useEmoji = false;

  // If clearly informal OR strong emotion → allow
  if (pInformal >= 0.60 || pPos >= 0.60 || pNeg >= 0.60) useEmoji = true;

  // Extra guard: very formal phrasing words
  const formalWords = /\b(report|meeting|invoice|deadline|attach(ed)?|regards|sincerely|as per|please find)\b/i;
  if (formalWords.test(userInput) && pFormal >= 0.60) useEmoji = false;

  return !!useEmoji;
}


function formatAIText(input) {
  let out = input
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  // combo (***text***)
  out = out.replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>");

  // bold (**text**)
  out = out.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

  // italic (*text*)
  out = out.replace(/\*(.+?)\*/g, "<em>$1</em>");

  // Always force bold for these keywords
  out = out.replace(/\b(Supreme AI|Sadiq Siddiqui|Siddique)\b/gi, "<strong>$1</strong>");

  return out;
}

  async function getKnowledgeSummary(userId = null, limit = 10) {
  try {
    let q = query(collection(db, "knowledge"), orderBy("timestamp", "desc"), limit(limit));
    if (userId) {
      q = query(q, where("userId", "==", userId));
    }

    const snapshot = await getDocs(q);
    if (snapshot.empty) {
      console.info("ℹ️ No knowledge entries found.");
      return {
        raw: [],
        formatted: "No long-term knowledge yet."
      };
    }

    const raw = [];
    const summaryLines = [];
    for (const doc of snapshot.docs) {
      const data = doc.data();
      const id = doc.id;
      const cleanInfo = sanitize(data.info ?? "No info");
      const cleanSource = sanitize(data.source ?? "unspecified");
      const time = formatTimestamp(data.timestamp);
      raw.push({ id, info: cleanInfo, source: cleanSource, timestamp: time });
      summaryLines.push(formatSummaryLine({ info: cleanInfo, source: cleanSource, time }));
    }

    return {
      raw,
      formatted: summaryLines.join("\n")
    };
  } catch (err) {
    console.error("❌ getKnowledgeSummary failed:", err.message);
    return {
      raw: [],
      formatted: "Error retrieving knowledge summary."
    };
  }
}

// ➕ Add new knowledge entry (optional dedupe)
async function addKnowledge(userId, info, source = "manual", { dedupe = false } = {}) {
  try {
    if (!userId || typeof userId !== "string") throw new Error("userId is required");
    const cleanInfo = limitLen(sanitize(info ?? "No info"), 500);
    const requestedSource = sanitize(source ?? "unspecified").toLowerCase();
    const cleanSource = SOURCE_ALLOWLIST.has(requestedSource) ? requestedSource : "unspecified";
    
    if (dedupe) {
      const dupSnap = await getDocs(query(
        collection(db, "knowledge"),
        where("userId", "==", userId),
        where("info", "==", cleanInfo),
        where("source", "==", cleanSource),
        where("isDeleted", "==", false),
        limit(1)
      ));
      if (!dupSnap.empty) {
        return { success: true, id: dupSnap.docs[0].id, deduped: true };
      }
    }

    const now = serverTimestamp();
    const payload = {
      userId,
      info: cleanInfo,
      source: cleanSource,
      isDeleted: false,
      timestamp: now,
      lastModified: now
    };

    const docRef = await addDoc(collection(db, "knowledge"), payload);
    const fresh = await getDoc(docRef);
    const data = fresh.data();
    const resolved = {
      id: docRef.id,
      userId: data.userId,
      info: data.info,
      source: data.source,
      isDeleted: data.isDeleted === true ? true : false,
      timestamp: formatTimestamp(data.timestamp),
      lastModified: formatTimestamp(data.lastModified)
    };

    console.info(`✅ Knowledge added: ${docRef.id}`);
    return { success: true, ...resolved };
  } catch (err) {
    console.error("❌ addKnowledge failed:", err.message);
    return { success: false, error: err.message };
  }
}

// ✏️ Update an existing knowledge entry (transactional, honors soft-delete)
async function updateKnowledge(id, newInfo, newSource = null) {
  try {
    if (!id) throw new Error("Document ID is required");
    const updates = {};
    if (newInfo != null) updates.info = limitLen(sanitize(newInfo), 500);
    if (newSource != null) {
      const src = sanitize(newSource).toLowerCase();
      updates.source = SOURCE_ALLOWLIST.has(src) ? src : "unspecified";
    }
    if (Object.keys(updates).length === 0) {
      const msg = "⚠️ No updates provided.";
      console.warn(msg);
      return { success: false, id, error: msg };
    }

    await runTransaction(db, async (tx) => {
      const ref = doc(db, "knowledge", id);
      const snap = await tx.get(ref);
      if (!snap.exists()) throw new Error("Document not found");
      const cur = snap.data();
      if (cur.isDeleted) throw new Error("Document is soft-deleted");

      tx.update(ref, {
        ...updates,
        lastModified: serverTimestamp()
      });
    });

    console.info(`✅ Knowledge updated: ${id}`);
    return { success: true, id, updates };
  } catch (err) {
    console.error("❌ updateKnowledge failed:", err.message);
    return { success: false, id, error: err.message };
  }
}

// 🗑️ Delete a knowledge entry (soft by default, idempotent)
async function deleteKnowledge(id, softDelete = true) {
  try {
    if (!id) throw new Error("Document ID is required");
    if (softDelete) {
      await runTransaction(db, async (tx) => {
        const ref = doc(db, "knowledge", id);
        const snap = await tx.get(ref);
        if (!snap.exists()) throw new Error("Document not found");
        const cur = snap.data();
        if (cur.isDeleted) return;
        tx.update(ref, {
          isDeleted: true,
          lastModified: serverTimestamp()
        });
      });
      console.info(`🗑️ Knowledge soft-deleted: ${id}`);
      return { success: true, id, softDeleted: true };
    }

    await deleteDoc(doc(db, "knowledge", id));
    console.info(`✅ Knowledge permanently deleted: ${id}`);
    return { success: true, id, softDeleted: false };
  } catch (err) {
    console.error("❌ deleteKnowledge failed:", err.message);
    return { success: false, id, error: err.message };
  }
}
async function restoreKnowledge(id) {
  try {
    if (!id) throw new Error("Document ID is required");
    await runTransaction(db, async (tx) => {
      const ref = doc(db, "knowledge", id);
      const snap = await tx.get(ref);
      if (!snap.exists()) throw new Error("Document not found");
      const cur = snap.data();
      if (!cur.isDeleted) return;
      tx.update(ref, {
        isDeleted: false,
        lastModified: serverTimestamp()
      });
    });

    console.info(`♻️ Knowledge restored: ${id}`);
    return { success: true, id };
  } catch (err) {
    console.error("❌ restoreKnowledge failed:", err.message);
    return { success: false, id, error: err.message };
  }
}

  }).trim();

  return str.length > max ? str.slice(0, max) : str;

// Returns localized string or "Unknown time"
function formatTimestamp(ts) {
  try {
    const date = ts?.toDate?.();
    if (date instanceof Date && !isNaN(date)) {
      return date.toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });
    }
  } catch {}
  return "Unknown time";
}
