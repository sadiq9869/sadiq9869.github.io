async function smartAnalyzeWithHuggingFace(userInput) {
  const normalized = userInput.trim().toLowerCase();

  const models = [
    "mistralai/Mistral-7B-Instruct-v0.1",
    "tiiuae/falcon-7b-instruct",
    "HuggingFaceH4/zephyr-7b-beta",
    "google/flan-t5-xxl",

    "databricks/dolly-v2-3b",

    "OpenAssistant/oasst-sft-4-pythia-12b-epoch-3.5",

    "HuggingFaceH4/starchat-alpha",

    "tiiuae/falcon-180B-chat",
    "HuggingFaceH4/zephyr-orpo-141b-A35b-v0.1",
    "OpenAssistant/oasst-sft-1-pythia-12b",
    "bigscience/T0pp",
    "Writer/palmyra-base"
  ];

  const fetches = models.map(model =>
    fetch(`https://api-inference.huggingface.co/models/${model}`, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${HF_API_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        inputs: `
You are an intelligent system that deeply understands user messages even if they have spelling mistakes, informal text, or broken grammar. 
Your task is to detect the user’s real intent, emotion, and purpose. Think like a human.
Only return a short, plain-language explanation of the user’s intent (not the answer).

🔹 You are a highly advanced, intelligent intent-analysis system.
🔹 Your mission is to deeply analyze the following user message and determine the user’s true intent, tone, and purpose. Think beyond the words — understand what the user is actually trying to ask, do, or express.
🔹 Return only a short, plain-language explanation of the intent. 
⚠️ Do not answer the question directly. Do not generate replies or solutions — just describe the user’s intent.
🔹 Use human-like reasoning. Detect context, emotion (if any), and type of request (e.g. ask for info, joke, command, opinion, etc.).
🔹 Your answer must be:
- Short (1-2 sentences max)
- Clear and direct
- Without extra phrases or fluff
- No AI-style introductions like “Sure!” or “Let me help…”
🧩 Example formatting:
✅ Input: "Tell me a joke"  
✅ Output: The user is asking for a joke.
✅ Input: "Can you explain quantum physics?"  
✅ Output: The user wants a simplified explanation of quantum physics.
✅ Input: "Show me today’s cricket score"  
✅ Output: The user is requesting the current cricket score.
📩 Now analyze this user input and return the detected intent below.\n\nQuestion:
Analyze and understand the user message: "${userInput}"`,
        options: { wait_for_model: true }
      })
    })
      .then(res => res.json())
      .then(data => {
        let text = "";
        if (Array.isArray(data) && data[0]?.generated_text) {
          text = data[0].generated_text.trim();
        } else if (data?.generated_text) {
          text = data.generated_text.trim();
        }
        return text.length > 2 ? { model, text } : null;
      })
      .catch(() => null)
  );

  const results = await Promise.allSettled(fetches);
  const validResponses = results
    .filter(r => r.status === "fulfilled" && r.value)
    .map(r => r.value);

  let finalIntent;
  if (validResponses.length === 0) {
    finalIntent = "Sorry, no model could analyze your message well.";

    finalIntent = validResponses[0].text;

      .map(r => `🧠 ${r.model} said: ${r.text}`)
      .join("\n\n");
  }

  localStorage.setItem("intent_" + normalized, finalIntent);
  return finalIntent;
}

async function detectAnswerLength(userInput) {

      body: JSON.stringify({
        inputs: `Analyze the following question and say only one word: short, medium, or long."${userInput}"`,
        options: { wait_for_model: true }
      })
    });
    if (!res.ok) throw new Error(`HTTP error ${res.status}`);
    const data = await res.json();
    let output = Array.isArray(data) ? data[0]?.generated_text : data?.generated_text;
    output = output?.toLowerCase().trim() || "medium";
    if (["short", "medium", "long"].includes(output)) return output;
    return "medium";
  } catch {

  }
}

// ==================== VALIDATE INTENT ====================
async function isIntentMeaningfulWithHuggingFace(userInput, intent) {
  const model = "google/flan-t5-xxl";
  try {
    const prompt = `User said: "${userInput}"\n\nIntent: "${intent}"\n\nIs this intent meaningful and accurate for the user's message? Just say YES or NO.`;
    const res = await fetch(`https://api-inference.huggingface.co/models/${model}`, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${HF_API_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ inputs: prompt, options: { wait_for_model: true } })
    });
    if (!res.ok) throw new Error(`HTTP error ${res.status}`);
    const data = await res.json();
    let output = Array.isArray(data) ? data[0]?.generated_text : data?.generated_text;
    output = (output || "").trim().toLowerCase();
    return output.includes("yes");
  } catch {
    return true;
  }
}

// ==================== DETECT INTENT ====================
async function detectIntent(query) {
  query = query.toLowerCase();
  const keywordNeedWebSearch = /(news|latest|who|when|where|how|what|current|today|reliable|trustworthy|credible)/.test(query);
  let type = "generic";
  if (/news|latest|today|current|trending|reliable/.test(query)) type = "trending";
  if (/definition|meaning|who is|what is|explain|understand/.test(query)) type = "evergreen";

  // Enhance with smartAnalyzeWithHuggingFace
  let needWebSearch = keywordNeedWebSearch;
  try {
    const intentText = await smartAnalyzeWithHuggingFace(query);
    const isValidIntent = await isIntentMeaningfulWithHuggingFace(query, intentText);
    if (isValidIntent) {
      const summarizedIntent = await summarizeIntentWithHuggingFace(query, intentText);
      if (summarizedIntent.toLowerCase().includes("news") || summarizedIntent.includes("current") || summarizedIntent.includes("trending")) {
        type = "trending";
        needWebSearch = true;
      } else if (summarizedIntent.includes("definition") || summarizedIntent.includes("explain")) {
        type = "evergreen";
      }
    }
  } catch (error) {
    console.log("AI intent detection failed, using keyword-based logic:", error);
  }

  if (type === "trending") needWebSearch = true;
  return { needWebSearch, type };
}

    const searchUrl = `https://www.googleapis.com/customsearch/v1?key=${GOOGLE_API_KEY}&cx=${GOOGLE_CX}&q=${encodeURIComponent(query)}`;

// ==================== VALIDATE ANSWER ====================
async function validateAnswer(query, answer) {
  if (!answer) return false;
  try {
    const res = await fetch("https://api-inference.huggingface.co/models/deepset/roberta-base-squad2", {
      method: "POST",
      headers: { Authorization: `Bearer ${HF_API_KEY}`, "Content-Type": "application/json" },
      body: JSON.stringify({
        inputs: { question: query, context: answer },
        options: { wait_for_model: true }
      })
    });
    if (!res.ok) throw new Error(`HTTP error ${res.status}`);
    const data = await res.json();
    if (data.answer && data.score > 0.2) {
      // Additional check for "most recent" queries
      if (query.toLowerCase().includes("most recent") && !answer.includes("2024")) {
        return false; // Fail if answer doesn’t mention the current year
      }
      return true;
    }
    const res2 = await fetch("https://api-inference.huggingface.co/models/facebook/bart-large-mnli", {
      method: "POST",
      headers: { Authorization: `Bearer ${HF_API_KEY}`, "Content-Type": "application/json" },
      body: JSON.stringify({
        inputs: `Is this answer relevant to the question "${query}" and does it focus on the most recent information? Answer: ${answer}`,
        parameters: { candidate_labels: ["relevant", "irrelevant"], wait_for_model: true }
      })
    });
    if (!res2.ok) throw new Error(`HTTP error ${res2.status}`);
    const data2 = await res2.json();
    if (!data2.labels || !data2.scores) throw new Error("Invalid API response");
    return data2.labels[0] === "relevant" && data2.scores[0] > 0.5;
  } catch (error) {
    console.log("Validation failed, assuming valid:", error);
    return true;
  }
}

// ==================== ADVANCED MEMORY LINKING ====================
function updateContextGraph(query) {
  try {
    const queryKey = query.toLowerCase();
    if (!contextGraph[queryKey]) {
      contextGraph[queryKey] = {
        relatedQueries: [],
        lastAsked: new Date().toISOString()
      };
    }
    conversationContext.slice(-5).forEach(ctx => {
      const ctxKey = ctx.query.toLowerCase();
      if (ctxKey !== queryKey && !contextGraph[queryKey].relatedQueries.includes(ctxKey)) {
        contextGraph[queryKey].relatedQueries.push(ctxKey);
      }
    });
    if (Object.keys(contextGraph).length > 1000) {
      const oldest = Object.keys(contextGraph).sort((a, b) => 
        new Date(contextGraph[a].lastAsked) - new Date(contextGraph[b].lastAsked)
      )[0];
      delete contextGraph[oldest];
    }
    localStorage.setItem("contextGraph", JSON.stringify(contextGraph));
  } catch (error) {
    console.error("Failed to update context graph:", error);
  }
}

function findRelatedQueries(query) {
  const queryKey = query.toLowerCase();
  const related = contextGraph[queryKey]?.relatedQueries || [];
  return related
    .map(q => answerStore[q])
    .filter(q => q && (new Date() - new Date(q.timestamp)) / (1000 * 60 * 60) < 24);
}

// ==================== FIND REUSABLE ANSWER ====================
function findReusableAnswer(query) {
  const stored = answerStore[query.toLowerCase()];
  if (!stored) return null;
  const timeElapsedHrs = (new Date() - new Date(stored.timestamp)) / (1000 * 60 * 60);
  if (stored.type === "evergreen") return stored.answer;
  if (stored.type === "trending" && timeElapsedHrs < 6) return stored.answer;
  if (stored.type === "generic" && timeElapsedHrs < 24) return stored.answer;
  
  const related = findRelatedQueries(query);
  if (related.length > 0) {
    const latestRelated = related.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))[0];
    if ((new Date() - new Date(latestRelated.timestamp)) / (1000 * 60 * 60) < 24) {
      return latestRelated.answer;
    }
  }
  return null;
}

// ==================== RESOLVE PRONOUNS ====================
function resolvePronouns(query) {
  if (/\b(he|she|it|they|him|her|them)\b/i.test(query) && conversationContext.length > 0) {
    const lastContext = conversationContext[conversationContext.length - 1];
    const lastEntity = lastContext.query;
    return query.replace(/\b(he|she|it|they|him|her|them)\b/gi, lastEntity);
  }
  return query;
}
