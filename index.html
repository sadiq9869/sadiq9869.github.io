// ==================== INTERNATIONAL CLOCK ====================
function getInternationalTime(location, type) {
  const now = new Date();
  const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  
  // Handle generic queries (no location)
  if (!location) {
    if (type === "date") {
      return `The date is ${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}.`;
    } else if (type === "time") {
      const hours = now.getHours() % 12 || 12;
      const minutes = now.getMinutes().toString().padStart(2, "0");
      const ampm = now.getHours() >= 12 ? "PM" : "AM";
      return `The time is ${hours}:${minutes} ${ampm} IST.`;
    }
  }

  // Map location to IANA time zone
  const normalizedLocation = location.toLowerCase().trim();
  let timeZone = TIME_ZONE_MAP[normalizedLocation];

  // Fallback to Google Custom Search for unmapped locations
  if (!timeZone) {
    return getLocationTimeFallback(location, type);
  }

  try {
    // Get date/time in the target time zone
    const options = type === "time" ? {
      timeZone,
      hour: "numeric",
      minute: "2-digit",
      hour12: true,
      timeZoneName: "short"
    } : {
      timeZone,
      month: "long",
      day: "numeric",
      year: "numeric"
    };
    const formatter = new Intl.DateTimeFormat("en-US", options);
    const formatted = formatter.format(now);
    
    return type === "time" 
      ? `The time in ${location} is ${formatted}.`
      : `The date in ${location} is ${formatted}.`;
  } catch (error) {
    console.error(`Failed to format time for ${location}:`, error);
    return getLocationTimeFallback(location, type);
  }
}

async function getLocationTimeFallback(location, type) {
  try {
    const searchQuery = `current date time ${location} 2025`;
    const searchUrl = `https://www.googleapis.com/customsearch/v1?key=${GOOGLE_API_KEY}&cx=${GOOGLE_CX}&q=${encodeURIComponent(searchQuery)}`;
    const res = await fetch(searchUrl);
    if (!res.ok) throw new Error(`HTTP error ${res.status}`);
    const data = await res.json();
    if (!data.items) return `The ${type} in ${location} is unavailable, but the date is Thursday, August 7, 2025.`;
    const snippet = data.items[0].snippet;
    const dateTimeMatch = snippet.match(/(January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2},\s*2025.*?(?:(\d{1,2}:\d{2}\s*(?:AM|PM)).*?([A-Z]{3,4}))?/i);
    if (dateTimeMatch) {
      const date = dateTimeMatch[0].split(/[:\s]/)[0];
      const time = dateTimeMatch[2] ? `${dateTimeMatch[2]} ${dateTimeMatch[3]}` : "";
      return type === "time" && time 
        ? `The time in ${location} is ${time} on ${date}, 2025.`
        : `The date in ${location} is ${date}, 2025.`;
    }
    return `The ${type} in ${location} is unavailable, but the date is Thursday, August 7, 2025.`;
  } catch (error) {
    console.error("Failed to fetch location time:", error);
    return `The ${type} in ${location} is unavailable, but the date is Thursday, August 7, 2025.`;
  }
}
