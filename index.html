<!DOCTYPE html>
<html>
<head>
  <title>Supreme AI - Login</title>
  <meta name="google-signin-client_id" content="183020375733-l81e2ur2a6gc4re1p72udipg1iles5e0.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #0a0a0a;
      color: white;
    }
    .profile {
      display: none;
      margin-top: 20px;
    }
    img {
      border-radius: 50%;
      margin-top: 10px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: crimson;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    iframe {
      width: 100%;
      height: 90vh;
      border: none;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Supreme AI 🔐</h1>
  <p>Sign in to start chatting with Supreme AI</p>

  <!-- Google Sign-In Button -->
  <div id="g_id_onload"
       data-client_id="183020375733-l81e2ur2a6gc4re1p72udipg1iles5e0.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <!-- Profile Info -->
  <div class="profile" id="profile">
    <h2>Welcome, <span id="name"></span> 👋</h2>
    <img id="pic" src="" width="100">
    <p>Email: <span id="email"></span></p>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- Supreme AI Interface -->
  <iframe id="aiFrame" src="supreme-ai.html"></iframe>

  <script>
    function handleCredentialResponse(response) {
      const data = decodeJwtResponse(response.credential);
      localStorage.setItem("supremeUser", JSON.stringify(data));
      showProfile();
    }

    function decodeJwtResponse(token) {
      let base64Url = token.split('.')[1];
      let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function showProfile() {
      let user = JSON.parse(localStorage.getItem("supremeUser"));
      if (user) {
        document.getElementById("name").innerText = user.name;
        document.getElementById("email").innerText = user.email;
        document.getElementById("pic").src = user.picture;
        document.getElementById("profile").style.display = "block";
        document.getElementById("aiFrame").style.display = "block";
      }
    }

    function logout() {
      localStorage.removeItem("supremeUser");
      location.reload();
    }

    window.onload = showProfile;
  </script>
</body>
</html>
