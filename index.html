        await new Promise(resolve => setTimeout(resolve, attempt * 1000));
      }
    }
  }

}

    return fallbackEmojis[Math.floor(Math.random() * fallbackEmojis.length)];
  }

  // Voting system based on priority
  const voteMap = {};
  valid.forEach(res => {
    res.emojis.forEach(e => {
      if (!voteMap[e]) voteMap[e] = 0;
      voteMap[e] += res.priority;
    });
  });

  // Sort emojis by vote count (highest first), randomize ties
  const sorted = Object.entries(voteMap)
    .sort((a, b) => b[1] - a[1] || Math.random() - 0.5)
    .map(([emoji]) => emoji);

  let combined = sorted.join("");

  // Optional Gemini refinement if too many emojis
  if (combined.length > 12) {

        })
      });

      let refined = geminiData?.candidates?.[0]?.content?.parts?.[0]?.text || combined;
      const emojiRegex = /[\p{Emoji}\uFE0F\u200D]+/gu;

      return combined;

  }

   // Stronger "should use emoji?" with NLI ensemble + formality + sentiment
async function shouldUseEmojiEnsemble(userInput) {
  const hf_apiKey = "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";

  // 1) NLI models for zero-shot YES/NO (emoji-appropriate vs not)
  const nliModels = [
    { name: "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli", weight: 1.0 }, // SOTA NLI on HF
    { name: "facebook/bart-large-mnli", weight: 0.8 },                                  // classic zero-shot
    { name: "joeddav/xlm-roberta-large-xnli", weight: 0.9 }                              // multilingual
  ];

  // 2) Side signals
  const formalityModel = "s-nlp/roberta-base-formality-ranker";                           // formal vs informal
  const sentimentModel = "cardiffnlp/twitter-roberta-base-sentiment-latest";              // pos/neu/neg (social text)

  // quick deterministic guard: technical/code-y text => no emoji
  const technicalRe = /(```|`[^`]+`|<[^>]+>|http(s)?:\/\/|\b(npm|git|yarn|pip|SELECT|INSERT|stacktrace|Exception)\b)/i;
  if (technicalRe.test(userInput)) return false;

  // ---- helpers ----
  const hf = (model, body) =>
    fetch(`https://api-inference.huggingface.co/models/${model}`, {
      method: "POST",
      headers: { Authorization: `Bearer ${hf_apiKey}`, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(r => r.json());

  const getLabelScore = (out, wanted) => {
    // supports both zero-shot (labels/scores) and text-classification (array of {label,score})
    if (Array.isArray(out)) {
      const hit = out.find(x => (x.label || "").toLowerCase() === wanted.toLowerCase());
      return hit ? hit.score : 0;
    }
    if (out && Array.isArray(out.labels) && Array.isArray(out.scores)) {
      const idx = out.labels.map(l => l.toLowerCase()).indexOf(wanted.toLowerCase());
      return idx >= 0 ? out.scores[idx] : 0;
    }
    return 0;
  };

  // ---- 1) NLI zero-shot: "emoji appropriate" vs "emoji inappropriate"
  const nliPayload = (text) => ({
    inputs: text,
    parameters: {
      candidate_labels: ["emoji appropriate", "emoji inappropriate"],
      hypothesis_template: "This message is {}.",
      multi_label: false
    },
    options: { wait_for_model: true }
  });

  const nliFetches = nliModels.map(m =>
    hf(m.name, nliPayload(userInput))
      .then(out => {
        const yes = getLabelScore(out, "emoji appropriate");
        const no  = getLabelScore(out, "emoji inappropriate");
        const margin = (yes - no);           // >0 means leaning YES
        return { model: m.name, weight: m.weight, yes, no, margin };
      })
      .catch(() => null)
  );

  // ---- 2) Formality & Sentiment
  const formalityFetch = hf(formalityModel, { inputs: userInput, options: { wait_for_model: true } })
    .catch(() => null);
  const sentimentFetch = hf(sentimentModel, { inputs: userInput, options: { wait_for_model: true } })
    .catch(() => null);

  const [nliResultsRaw, formalityOut, sentimentOut] = await Promise.all([
    Promise.allSettled(nliFetches),
    formalityFetch, sentimentFetch
  ]);

  const nli = nliResultsRaw
    .filter(r => r.status === "fulfilled" && r.value)
    .map(r => r.value);

  // If everything failed, be conservative:
  if (nli.length === 0 && !formalityOut && !sentimentOut) return false;

  // Weighted NLI decision
  const weightedYes = nli.reduce((s, r) => s + r.yes * r.weight, 0);
  const weightedNo  = nli.reduce((s, r) => s + r.no  * r.weight, 0);
  const nliConfidence = weightedYes + weightedNo > 0 ? weightedYes / (weightedYes + weightedNo) : 0.5;

  // Formality (prefer no emoji if clearly formal)
  const pFormal   = getLabelScore(formalityOut, "formal");
  const pInformal = getLabelScore(formalityOut, "informal");

  // Sentiment: strong non-neutral emotion nudges to YES
  const pPos = getLabelScore(sentimentOut, "positive");
  const pNeu = getLabelScore(sentimentOut, "neutral");
  const pNeg = getLabelScore(sentimentOut, "negative");

  // ---- Decision logic ----
  let useEmoji = nliConfidence >= 0.55; // base

  // If very formal AND neutral → avoid emojis
  if (pFormal >= 0.70 && pNeu >= 0.60) useEmoji = false;

  // If clearly informal OR strong emotion → allow
  if (pInformal >= 0.60 || pPos >= 0.60 || pNeg >= 0.60) useEmoji = true;

  // Extra guard: very formal phrasing words
  const formalWords = /\b(report|meeting|invoice|deadline|attach(ed)?|regards|sincerely|as per|please find)\b/i;
  if (formalWords.test(userInput) && pFormal >= 0.60) useEmoji = false;

  return !!useEmoji;
}


function formatAIText(input) {
  let out = input
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  // ### Heading
  out = out.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  // ## Heading
  out = out.replace(/^## (.+)$/gm, "<h2>$1</h2>");
  // # Heading
  out = out.replace(/^# (.+)$/gm, "<h2>$1</h2>");

  // Bullet points (support both "-" and "*")
  out = out.replace(/^\s*[-*] (.+)$/gm, "<li>$1</li>");
  // Wrap consecutive <li> in <ul>
  out = out.replace(/(<li>[\s\S]*?<\/li>)/g, "<ul>$1</ul>");

  // combo (***text***)
  out = out.replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>");
  // bold (**text**)
  out = out.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  // italic (*text*) → only if not part of bullet
  out = out.replace(/(^|[^-])\*(.+?)\*/g, "$1<em>$2</em>");

  // Force bold for keywords
  out = out.replace(/\b(Supreme AI|Sadiq Siddiqui|Siddique)\b/gi, "<strong>$1</strong>");

  return out;
}

// ➕ Add new knowledge entry (optional dedupe)
async function addKnowledge(userId, info, source = "manual", { dedupe = false } = {}) {
  try {
    if (!userId || typeof userId !== "string") throw new Error("userId is required");
    const cleanInfo = limitLen(sanitize(info ?? "No info"), 500);
    const requestedSource = sanitize(source ?? "unspecified").toLowerCase();
    const cleanSource = SOURCE_ALLOWLIST.has(requestedSource) ? requestedSource : "unspecified";
    
    if (dedupe) {
      const dupSnap = await getDocs(query(
        collection(db, "knowledge"),
        where("userId", "==", userId),
        where("info", "==", cleanInfo),
        where("source", "==", cleanSource),
        where("isDeleted", "==", false),
        limit(1)
      ));
      if (!dupSnap.empty) {
        return { success: true, id: dupSnap.docs[0].id, deduped: true };
      }
    }

    const now = serverTimestamp();
    const payload = {
      userId,
      info: cleanInfo,
      source: cleanSource,
      isDeleted: false,
      timestamp: now,
      lastModified: now
    };

    const docRef = await addDoc(collection(db, "knowledge"), payload);
    const fresh = await getDoc(docRef);
    const data = fresh.data();
    const resolved = {
      id: docRef.id,
      userId: data.userId,
      info: data.info,
      source: data.source,
      isDeleted: data.isDeleted === true ? true : false,
      timestamp: formatTimestamp(data.timestamp),
      lastModified: formatTimestamp(data.lastModified)
    };

    console.info(`✅ Knowledge added: ${docRef.id}`);
    return { success: true, ...resolved };
  } catch (err) {
    console.error("❌ addKnowledge failed:", err.message);
    return { success: false, error: err.message };
  }
}

// ✏️ Update an existing knowledge entry (transactional, honors soft-delete)
async function updateKnowledge(id, newInfo, newSource = null) {
  try {
    if (!id) throw new Error("Document ID is required");
    const updates = {};
    if (newInfo != null) updates.info = limitLen(sanitize(newInfo), 500);
    if (newSource != null) {
      const src = sanitize(newSource).toLowerCase();
      updates.source = SOURCE_ALLOWLIST.has(src) ? src : "unspecified";
    }
    if (Object.keys(updates).length === 0) {
      const msg = "⚠️ No updates provided.";
      console.warn(msg);
      return { success: false, id, error: msg };
    }

    await runTransaction(db, async (tx) => {
      const ref = doc(db, "knowledge", id);
      const snap = await tx.get(ref);
      if (!snap.exists()) throw new Error("Document not found");
      const cur = snap.data();
      if (cur.isDeleted) throw new Error("Document is soft-deleted");

      tx.update(ref, {
        ...updates,
        lastModified: serverTimestamp()
      });
    });

    console.info(`✅ Knowledge updated: ${id}`);
    return { success: true, id, updates };
  } catch (err) {
    console.error("❌ updateKnowledge failed:", err.message);
    return { success: false, id, error: err.message };
  }
}

// 🗑️ Delete a knowledge entry (soft by default, idempotent)
async function deleteKnowledge(id, softDelete = true) {
  try {
    if (!id) throw new Error("Document ID is required");
    if (softDelete) {
      await runTransaction(db, async (tx) => {
        const ref = doc(db, "knowledge", id);
        const snap = await tx.get(ref);
        if (!snap.exists()) throw new Error("Document not found");
        const cur = snap.data();
        if (cur.isDeleted) return;
        tx.update(ref, {
          isDeleted: true,
          lastModified: serverTimestamp()
        });
      });
      console.info(`🗑️ Knowledge soft-deleted: ${id}`);
      return { success: true, id, softDeleted: true };
    }

    await deleteDoc(doc(db, "knowledge", id));
    console.info(`✅ Knowledge permanently deleted: ${id}`);
    return { success: true, id, softDeleted: false };
  } catch (err) {
    console.error("❌ deleteKnowledge failed:", err.message);
    return { success: false, id, error: err.message };
  }
}
async function restoreKnowledge(id) {
  try {
    if (!id) throw new Error("Document ID is required");
    await runTransaction(db, async (tx) => {
      const ref = doc(db, "knowledge", id);
      const snap = await tx.get(ref);
      if (!snap.exists()) throw new Error("Document not found");
      const cur = snap.data();
      if (!cur.isDeleted) return;
      tx.update(ref, {
        isDeleted: false,
        lastModified: serverTimestamp()
      });
    });

    console.info(`♻️ Knowledge restored: ${id}`);
    return { success: true, id };
  } catch (err) {
    console.error("❌ restoreKnowledge failed:", err.message);
    return { success: false, id, error: err.message };
  }
}

function sanitize(text) {
  console.info('📌 Sanitizing text');
  try {
    if (!window.sanitizeHtml) {
      console.warn('⚠️ sanitizeHtml not available, returning raw text');
      return text;
    }
    const result = window.sanitizeHtml(text, {
      allowedTags: [],
      allowedAttributes: {}
    }).trim();
    console.log('📌 Text sanitized successfully');
    return result;
  } catch (err) {
    console.error('❌ Error sanitizing text:', err.message, err.stack);
    return text; // Fallback to raw text
  }
}

// Returns localized string or "Unknown time"
function formatTimestamp(ts) {
  try {
    const date = ts?.toDate?.();
    if (date instanceof Date && !isNaN(date)) {
      return date.toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });
    }
  } catch {}
  return "Unknown time";
}
