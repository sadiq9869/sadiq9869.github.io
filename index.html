<script>
  const attachBtn = document.getElementById('attachBtn');
  const attachMenu = document.getElementById('attachMenu');
  const imageUploadBtn = document.getElementById('imageUploadBtn');
  const chatInput = document.getElementById('chatInput');

  const hiddenFile = document.createElement('input');
  hiddenFile.type = 'file';
  hiddenFile.accept = 'image/*';
  hiddenFile.multiple = true;
  hiddenFile.style.display = 'none';
  document.body.appendChild(hiddenFile);

  attachBtn.addEventListener('click', (e) => {
    e.preventDefault();
    const isOpen = attachMenu.classList.contains('open');
    attachMenu.classList.toggle('open', !isOpen);
    attachBtn.classList.toggle('open', !isOpen);
  });

  imageUploadBtn.addEventListener('click', (e) => {
    e.preventDefault();
    hiddenFile.click();
    attachMenu.classList.remove('open');
    attachBtn.classList.remove('open');
  });

  hiddenFile.addEventListener('change', (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    chatInput.value = chatInput.value + (chatInput.value ? '\n' : '') + '[Attached: ' + file.name + ']';
  });

  document.addEventListener('click', (e) => {
    if (!attachBtn.contains(e.target) && !attachMenu.contains(e.target)) {
      attachMenu.classList.remove('open');
      attachBtn.classList.remove('open');
    }
  });

  function generateUniqueId() {
    let existingId = localStorage.getItem("supremeUserId");
    if (existingId) return existingId;
    const newId = uuidv4();
    localStorage.setItem("supremeUserId", newId);
    return newId;
  }

  const apiKey = "AIzaSyCeOgZbJJOFVFqGxH5NmZmedTMGPA8ZZ1o";
  const proxyUrl = "https://cors-anywhere.herokuapp.com/";
  const apiUrl = proxyUrl + "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + apiKey;

  async function getMemoryContext() {
    const userId = generateUniqueId();
    try {
      const q = query(
        collection(db, "chatMemory"),
        where("userId", "==", userId),
        orderBy("timestamp", "desc"),
        limit(10)
      );
      const snapshot = await getDocs(q);
      if (snapshot.empty) {
        return "No previous conversation available.";
      }
      return snapshot.docs.map(doc => {
        const data = doc.data();
        return `User: ${data.user}\nIntent: ${data.intent}\nSupreme AI: ${data.ai}`;
      }).reverse().join("\n\n");
    } catch (e) {
      console.error("Error fetching memory:", e);
      const memory = JSON.parse(localStorage.getItem("chatMemory") || "[]");
      const userMemory = memory.filter(item => item.userId === userId);
      if (userMemory.length === 0) {
        return "No previous conversation available.";
      }
      return userMemory
        .slice(-10)
        .map(item => `User: ${item.user}\nIntent: ${item.intent}\nSupreme AI: ${item.ai}`)
        .join("\n\n");
    }
  }

  async function saveToMemory({ user, intent, ai }) {
    const userId = generateUniqueId();
    try {
      await addDoc(collection(db, "chatMemory"), {
        userId: userId,
        user: sanitize(user),
        intent: sanitize(intent),
        ai: sanitize(ai),
        timestamp: serverTimestamp()
      });
    } catch (e) {
      console.error("Error saving chat:", e);
      const memory = JSON.parse(localStorage.getItem("chatMemory") || "[]");
      memory.push({
        userId: userId,
        user: user,
        intent: intent,
        ai: ai
      });
      localStorage.setItem("chatMemory", JSON.stringify(memory));
    }
  }

  async function smartAnalyzeWithHuggingFace(userInput) {
    const hf_apiKey = "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";
    const normalized = userInput.trim().toLowerCase();
    const cached = localStorage.getItem("intent_" + normalized);
    if (cached) return cached;
    const models = [
      "google/flan-t5-xxl",
      "bigscience/T0pp",
      "yeniguno/bert-uncased-intent-classification"
    ];

    const fetches = models.map(model =>
      fetch(proxyUrl + `https://api-inference.huggingface.co/models/${model}`, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${hf_apiKey}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          inputs: `
You are an intelligent system that deeply understands user messages even if they have spelling mistakes, informal text, or broken grammar. 
Your task is to detect the user’s real intent, emotion, and purpose. Think like a human.
Only return a short, plain-language explanation of the user’s intent (not the answer).

🔹 You are a highly advanced, intelligent intent-analysis system.

🔹 Your mission is to deeply analyze the following user message and determine the user’s true intent, tone, and purpose. Think beyond the words — understand what the user is actually trying to ask, do, or express.

🔹 Return only a short, plain-language explanation of the intent. 
⚠️ Do not answer the question directly. Do not generate replies or solutions — just describe the user’s intent.

🔹 Use human-like reasoning. Detect context, emotion (if any), and type of request (e.g. ask for info, joke, command, opinion, etc.).

🔹 Your answer must be:
- Short (1-2 sentences max)
- Clear and direct
- Without extra phrases or fluff
- No AI-style introductions like “Sure!” or “Let me help…”

🧩 Example formatting:
✅ Input: "Tell me a joke"  
✅ Output: The user is asking for a joke.

✅ Input: "Can you explain quantum physics?"  
✅ Output: The user wants a simplified explanation of quantum physics.

✅ Input: "Show me today’s cricket score"  
✅ Output: The user is requesting the current cricket score.

📩 Now analyze this user input and return the detected intent below.\n\nQuestion:
Analyze and understand the user message: "${userInput}"`,
          options: { wait_for_model: true }
        })
      })
        .then(res => res.json())
        .then(data => {
          let text = "";
          if (Array.isArray(data) && data[0]?.generated_text) {
            text = data[0].generated_text.trim();
          } else if (data?.generated_text) {
            text = data.generated_text.trim();
          }
          return text.length > 2 ? { model, text } : null;
        })
        .catch(() => null)
    );

    const results = await Promise.allSettled(fetches);
    const validResponses = results
      .filter(r => r.status === "fulfilled" && r.value)
      .map(r => r.value);

    let finalIntent = "";
    if (validResponses.length === 0) {
      finalIntent = "Sorry, no model could analyze your message well.";
    } else if (validResponses.length === 1) {
      finalIntent = validResponses[0].text;
    } else {
      finalIntent = `Multiple expert models provided insights:\n\n` + validResponses
        .slice(0, 3)
        .map(r => `🧠 ${r.model} said: ${r.text}`)
        .join("\n\n");
    }

    localStorage.setItem("intent_" + normalized, finalIntent);
    return finalIntent;
  }

  async function isIntentMeaningfulWithHuggingFace(userInput, intent) {
    const hf_apiKey = "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";
    const model = "google/flan-t5-xxl";
    try {
      const prompt = `User said: "${userInput}"\n\nIntent: "${intent}"\n\nIs this intent meaningful and accurate for the user's message? Just say YES or NO.`;
      const res = await fetch(proxyUrl + `https://api-inference.huggingface.co/models/${model}`, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${hf_apiKey}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ inputs: prompt, options: { wait_for_model: true } })
      });
      const data = await res.json();
      let output = Array.isArray(data) ? data[0]?.generated_text : data?.generated_text;
      output = (output || "").trim().toLowerCase();
      return output.includes("yes");
    } catch {
      return true;
    }
  }

  async function summarizeIntentWithHuggingFace(userInput, intent) {
    const hf_apiKey = "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";
    const models = [
      "google/flan-t5-xxl",
      "facebook/bart-large-cnn",
      "google/t5-large"
    ];
    const prompt = `User said: "${userInput}"\n\nInterpreted Intent: "${intent}"\n\nSummarize this intent into a short 3-6 word label.`;
    const fetches = models.map(model =>
      fetch(proxyUrl + `https://api-inference.huggingface.co/models/${model}`, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${hf_apiKey}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ inputs: prompt, options: { wait_for_model: true } })
      })
        .then(res => res.json())
        .then(data => {
          let output = Array.isArray(data) ? data[0]?.generated_text : data?.generated_text;
          return (output || "").trim().replace(/[".]/g, "");
        })
        .catch(() => null)
    );
    const results = await Promise.allSettled(fetches);
    const validResponses = results
      .filter(r => r.status === "fulfilled" && r.value)
      .map(r => r.value);
    if (validResponses.length === 0) {
      return intent;
    }
    if (validResponses.length === 1) {
      return validResponses[0];
    }
    const combinePrompt = `
We got multiple model summaries for the same intent:
${validResponses.map((res, i) => `Option ${i + 1}: ${res}`).join("\n")}
Now combine them and return the **best, most accurate, single 3-6 word intent label**.
Do not add extra text. Only output the final label
`;
    try {
      const res = await fetch(proxyUrl + "https://api-inference.huggingface.co/models/google/flan-t5-xxl", {
        method: "POST",
        headers: {
          Authorization: `Bearer ${hf_apiKey}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ inputs: combinePrompt, options: { wait_for_model: true } })
      });
      const data = await res.json();
      let finalOutput = Array.isArray(data) ? data[0]?.generated_text : data?.generated_text;
      return (finalOutput || validResponses[0]).trim().replace(/[".]/g, "");
    } catch {
      return validResponses[0];
    }
  }

  async function saveToSmartMemory(userInput, aiReply) {

    const label = await summarizeIntentWithHuggingFace(userInput, intent);
    try {
      await addDoc(collection(db, "chatMemory"), {
        userId: userId,
        user: sanitize(userInput),
        intent: sanitize(label),
        ai: sanitize(aiReply),
        timestamp: serverTimestamp()
      });
    } catch (e) {
      console.error("Error saving to Firebase:", e);
      const memory = JSON.parse(localStorage.getItem("chatMemory") || "[]");
      memory.push({
        userId: userId,
        user: userInput,
        intent: label,
        ai: aiReply
      });
      localStorage.setItem("chatMemory", JSON.stringify(memory));
    }
  }

  async function addKnowledge(userId, info, source = "manual", { dedupe = false } = {}) {
    try {
      if (!userId || typeof userId !== "string") throw new Error("userId is required");
      const cleanInfo = limitLen(sanitize(info ?? "No info"), 500);
      const requestedSource = sanitize(source ?? "unspecified").toLowerCase();
      const cleanSource = SOURCE_ALLOWLIST.has(requestedSource) ? requestedSource : "unspecified";
      if (dedupe) {
        const dupSnap = await getDocs(query(
          collection(db, "knowledge"),
          where("userId", "==", userId),
          where("info", "==", cleanInfo),
          where("source", "==", cleanSource),
          where("isDeleted", "==", false),
          limit(1)
        ));
        if (!dupSnap.empty) {
          return { success: true, id: dupSnap.docs[0].id, deduped: true };
        }
      }
      const now = serverTimestamp();
      const payload = {
        userId,
        info: cleanInfo,
        source: cleanSource,
        isDeleted: false,
        timestamp: now,
        lastModified: now
      };
      const docRef = await addDoc(collection(db, "knowledge"), payload);
      const fresh = await getDoc(docRef);
      const data = fresh.data();
      const resolved = {
        id: docRef.id,
        userId: data.userId,
        info: data.info,
        source: data.source,
        isDeleted: data.isDeleted === true ? true : false,
        timestamp: formatTimestamp(data.timestamp),
        lastModified: formatTimestamp(data.lastModified)
      };
      console.info(`✅ Knowledge added: ${docRef.id}`);
      return { success: true, ...resolved };
    } catch (err) {
      console.error("❌ addKnowledge failed:", err.message);
      return { success: false, error: err.message };
    }
  }

  async function updateKnowledge(id, newInfo, newSource = null) {
    try {
      if (!id) throw new Error("Document ID is required");
      const updates = {};
      if (newInfo != null) updates.info = limitLen(sanitize(newInfo), 500);
      if (newSource != null) {
        const src = sanitize(newSource).toLowerCase();
        updates.source = SOURCE_ALLOWLIST.has(src) ? src : "unspecified";
      }
      if (Object.keys(updates).length === 0) {
        const msg = "⚠️ No updates provided.";
        console.warn(msg);
        return { success: false, id, error: msg };
      }
      await runTransaction(db, async (tx) => {
        const ref = doc(db, "knowledge", id);
        const snap = await tx.get(ref);
        if (!snap.exists()) throw new Error("Document not found");
        const cur = snap.data();
        if (cur.isDeleted) throw new Error("Document is soft-deleted");
        tx.update(ref, {
          ...updates,
          lastModified: serverTimestamp()
        });
      });
      console.info(`✅ Knowledge updated: ${id}`);
      return { success: true, id, updates };
    } catch (err) {
      console.error("❌ updateKnowledge failed:", err.message);
      return { success: false, id, error: err.message };
    }
  }

    try {
      if (!id) throw new Error("Document ID is required");
      if (softDelete) {
        await runTransaction(db, async (tx) => {
          const ref = doc(db, "knowledge", id);
          const snap = await tx.get(ref);
          if (!snap.exists()) throw new Error("Document not found");
          const cur = snap.data();
          if (cur.isDeleted) return;
          tx.update(ref, {
            isDeleted: true,
            lastModified: serverTimestamp()
          });
        });
        console.info(`🗑️ Knowledge soft-deleted: ${id}`);
        return { success: true, id, softDeleted: true };
      }
      await deleteDoc(doc(db, "knowledge", id));
      console.info(`✅ Knowledge permanently deleted: ${id}`);
      return { success: true, id, softDeleted: false };

      return { success: false, id, error: err.message };
    }
  }

          JSON.stringify(sources),
          "search"
        );
      }
      if (!knowledgeModified) {
        await evolveFromChat(userId, userInput, text);
      }
      const colors = ["green", "orange", "red", "cyan", "yellow"];
      const color = colors[Math.floor(Math.random() * colors.length)];
      const glow = Math.floor(Math.random() * 10);
      let emoji = "";
      const useEmoji = await shouldUseEmojiEnsemble(userInput);
      if (useEmoji) {
        emoji = await detectEmojiSmart(userInput);
      }
      aiMsg.innerHTML = `<span style="color:${color};text-shadow:0 0 ${glow}px ${color};">Supreme AI:</span> ${formatAIText(text)} ${emoji}`;
    } catch (e) {
      console.error("Error in showResponse:", e);
      let errorMessage = "Supreme AI could not connect to the server. 😓<br>";
      if (e.message.includes("NetworkError") || e.message.includes("Failed to fetch")) {
        errorMessage += "<strong>Kyun?</strong> Internet connection weak ya band hai.<br>";
        errorMessage += "<strong>Solution:</strong> Wi-Fi ya mobile data check kar, aur thodi der baad try kar. 😊";
      } else if (e.message.includes("401") || e.message.includes("Unauthorized")) {
        errorMessage += "<strong>Kyun?</strong> API key galat ya expire ho gaya hai.<br>";
        errorMessage += "<strong>Solution:</strong> Nayi API key generate kar ya owner se contact kar (Sadiq Siddiqui). 📧";
      } else if (e.message.includes("403") || e.message.includes("Forbidden")) {
        errorMessage += "<strong>Kyun?</strong> CORS policy ya domain restriction ke wajah se access block hai.<br>";
        errorMessage += "<strong>Solution:</strong> API key ke allowed origins mein 'https://sadiq9869.github.io' add kar ya proxy server use kar. 🌐";
      } else if (e.message.includes("429") || e.message.includes("Too Many Requests")) {
        errorMessage += "<strong>Kyun?</strong> API ke requests ka limit cross ho gaya.<br>";
        errorMessage += "<strong>Solution:</strong> Thodi der (5-10 min) wait kar ke dobara try kar. ⏳";
      } else {
        errorMessage += `<strong>Kyun?</strong> Server mein issue ya unexpected error: ${e.message}.<br>`;
        errorMessage += "<strong>Solution:</strong> Thodi der baad try kar, ya owner se contact kar (Sadiq Siddiqui). 📞";
      }
      aiMsg.innerHTML = errorMessage;
    }

    responseBox.scrollTo({ top: responseBox.scrollHeight, behavior: "smooth" });

    setTimeout(() => {
      if (responseBox.children.length <= 1) {
        if (signature) {
          signature.style.display = "block";
        }
      }
    }, 500);
  }
</script>
