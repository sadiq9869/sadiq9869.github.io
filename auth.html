<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supreme AI • Welcome</title>
  <style>
    /* ---------- Base Styles ---------- */
    body {
      margin: 0;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #1f1c2c 0%, #090909 80%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 30px;
      overflow: hidden;
      position: relative; /* Stars in background */
    }

    /* ---------- Stars in Background ---------- */
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      animation: twinkle 3s ease-in-out infinite alternate, drift 25s linear infinite;
      box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
    }
    .star::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      background: inherit;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      animation: sparkle 1.5s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }
    @keyframes sparkle {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
    }
    @keyframes drift {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(var(--drift-x, 100px), var(--drift-y, 50px)) rotate(360deg); }
    }
    /* Star positions */
    .star:nth-child(1) { width: 2px; height: 2px; top: 10%; left: 15%; --drift-x: 50px; --drift-y: 20px; animation-delay: 0s; }
    .star:nth-child(2) { width: 1px; height: 1px; top: 15%; left: 30%; --drift-x: -30px; --drift-y: 40px; animation-delay: 1s; }
    .star:nth-child(3) { width: 3px; height: 3px; top: 20%; left: 50%; --drift-x: 80px; --drift-y: -10px; animation-delay: 2s; }
    .star:nth-child(4) { width: 1.5px; height: 1.5px; top: 25%; left: 70%; --drift-x: -60px; --drift-y: 30px; animation-delay: 0.5s; }
    .star:nth-child(5) { width: 2.5px; height: 2.5px; top: 30%; left: 5%; --drift-x: 40px; --drift-y: 60px; animation-delay: 1.5s; }
    .star:nth-child(6) { width: 1px; height: 1px; top: 35%; left: 80%; --drift-x: -20px; --drift-y: -30px; animation-delay: 2.5s; }
    .star:nth-child(7) { width: 2px; height: 2px; top: 40%; left: 20%; --drift-x: 70px; --drift-y: 10px; animation-delay: 0.2s; }
    .star:nth-child(8) { width: 3px; height: 3px; top: 45%; left: 60%; --drift-x: -50px; --drift-y: 50px; animation-delay: 1.2s; }
    .star:nth-child(9) { width: 1.5px; height: 1.5px; top: 50%; left: 10%; --drift-x: 30px; --drift-y: -40px; animation-delay: 3s; }
    .star:nth-child(10) { width: 2px; height: 2px; top: 55%; left: 45%; --drift-x: -80px; --drift-y: 20px; animation-delay: 0.8s; }
    .star:nth-child(11) { width: 1px; height: 1px; top: 60%; left: 75%; --drift-x: 60px; --drift-y: -50px; animation-delay: 2.2s; }
    .star:nth-child(12) { width: 2.5px; height: 2.5px; top: 65%; left: 25%; --drift-x: -40px; --drift-y: 30px; animation-delay: 1.8s; }
    .star:nth-child(13) { width: 3px; height: 3px; top: 70%; left: 55%; --drift-x: 20px; --drift-y: 40px; animation-delay: 0.4s; }
    .star:nth-child(14) { width: 1.5px; height: 1.5px; top: 75%; left: 90%; --drift-x: -70px; --drift-y: -20px; animation-delay: 2.8s; }
    .star:nth-child(15) { width: 2px; height: 2px; top: 80%; left: 35%; --drift-x: 50px; --drift-y: 10px; animation-delay: 1.1s; }

    /* ---------- Popup Card ---------- */
    .popup {
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(15px);
      border: 3px solid rgba(0, 255, 255, 0.6);
      border-radius: 50px;
      padding: 28px 25px 35px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.4), inset 0 0 15px rgba(0, 255, 255, 0.1);
      animation: slideUp 0.9s ease-out forwards, morphPulse 5s infinite alternate ease-in-out;
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      opacity: 0;
      z-index: 10; /* Stars ke upar popup rahe */
    }

    @keyframes slideUp {
      to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    }

    @keyframes morphPulse {
      0% {
        box-shadow: 0 0 20px #00ffff, inset 0 0 10px rgba(0, 255, 255, 0.2);
        border-radius: 50px;
      }
      100% {
        box-shadow: 0 0 35px #00ffff, inset 0 0 18px rgba(0, 255, 255, 0.4);
        border-radius: 55px 45px 55px 45px;
      }
    }

    /* ---------- Typing Effect for Title ---------- */
    h1 {
      font-size: 26px;
      margin: 0 0 12px;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff, 0 0 20px rgba(0,255,255,0.4);
      font-weight: 700;
      letter-spacing: 0.5px;
      overflow: hidden;
      border-right: 2px solid #00ffff;
      white-space: nowrap;
      animation: typing 2s steps(20) forwards, blink 1s infinite, fadeInUp 0.8s ease-out 0.5s both, cursorFadeOut 0.5s ease-out 2.5s forwards;
      width: 0;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes blink {
      0%, 50% { border-color: #00ffff; }
      51%, 100% { border-color: transparent; }
    }
    @keyframes cursorFadeOut {
      to {
        border-right-color: transparent;
        border-right-width: 0;
      }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Welcome Message Styling ---------- */
    .welcome-msg {
      font-size: 15px;
      color: #00ffff;
      font-weight: 600;
      margin: 0 0 10px;
      text-shadow: 0 0 8px #00ffff;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.8s both;
    }

    /* ---------- Staggered Text Fade-In ---------- */
    p {
      font-size: 14px;
      margin: 0 0 25px;
      opacity: 0;
      line-height: 1.5;
      animation: fadeInUp 0.8s ease-out 1.2s both;
    }

    /* ---------- Button Container ---------- */
    .button-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      width: 100%;
    }

    /* ---------- Enhanced Buttons ---------- */
    .btn {
      display: block;
      width: 240px;
      padding: 16px 0;
      border-radius: 50px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0;
      cursor: pointer;
      text-shadow: 0 0 8px currentColor;
    }
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.7s;
    }
    .btn:hover::before {
      left: 100%;
    }
    .btn::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50px;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }
    .btn:hover::after {
      opacity: 1;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.05);
        opacity: 0.4;
      }
    }
    @keyframes slideInScale {
      0% {
        opacity: 0;
        transform: translateY(-50px) scale(0.8) rotate(-5deg);
      }
      60% {
        transform: translateY(10px) scale(1.05) rotate(2deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0deg);
      }
    }
    .btn:nth-child(1) {
      animation: slideInScale 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55) 1.8s both;
    }
    .btn:nth-child(2) {
      animation: slideInScale 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55) 2.2s both;
    }

    /* Login Button Styling */
    .login {
      background: linear-gradient(135deg, rgba(0, 255, 255, 0.2) 0%, rgba(0, 180, 255, 0.3) 100%);
      color: #00ffff;
      border: 3px solid #00ffff;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.4), inset 0 0 15px rgba(0, 255, 255, 0.1);
    }
    .login::after {
      background: radial-gradient(circle, rgba(0, 255, 255, 0.6) 0%, transparent 70%);
    }
    .login:hover {
      background: linear-gradient(135deg, #00ffff 0%, #00ccff 100%);
      color: #000;
      transform: translateY(-5px) scale(1.08);
      box-shadow: 0 8px 35px rgba(0, 255, 255, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.3);
      border-color: #66ffff;
    }
    .login:active {
      transform: translateY(-2px) scale(1.02);
    }

    /* Signup Button Styling */
    .signup {
      background: linear-gradient(135deg, rgba(255, 0, 255, 0.2) 0%, rgba(200, 0, 255, 0.3) 100%);
      color: #ff00ff;
      border: 3px solid #ff00ff;
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.4), inset 0 0 15px rgba(255, 0, 255, 0.1);
    }
    .signup::after {
      background: radial-gradient(circle, rgba(255, 0, 255, 0.6) 0%, transparent 70%);
    }
    .signup:hover {
      background: linear-gradient(135deg, #ff00ff 0%, #cc00ff 100%);
      color: #fff;
      transform: translateY(-5px) scale(1.08);
      box-shadow: 0 8px 35px rgba(255, 0, 255, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.2);
      border-color: #ff66ff;
    }
    .signup:active {
      transform: translateY(-2px) scale(1.02);
    }

    /* Floating Icon Animation */
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .btn:hover {
      animation: floatIcon 0.8s ease-in-out infinite;
    }

    /* ---------- Enhanced Floating Neon Particles ---------- */
    .neon-particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, #00ffff 0%, transparent 70%);
      animation: floatRotate 8s infinite ease-in-out;
      opacity: 0.6;
      box-shadow: 0 0 10px #00ffff;
      z-index: 5;
    }
    @keyframes floatRotate {
      0%, 100% {
        transform: translateY(0) rotate(0deg) scale(1);
        opacity: 0.6;
        filter: hue-rotate(0deg);
      }
      33% {
        transform: translateY(-15px) rotate(120deg) scale(1.3);
        opacity: 0.9;
        filter: hue-rotate(90deg);
      }
      66% {
        transform: translateY(-30px) rotate(240deg) scale(0.8);
        opacity: 0.7;
        filter: hue-rotate(180deg);
      }
    }
    .particle1 { width: 8px; height: 8px; top: 60%; left: 20%; animation-delay: 0s; }
    .particle2 { width: 6px; height: 6px; top: 70%; left: 60%; animation-delay: 2s; }
    .particle3 { width: 10px; height: 10px; top: 65%; left: 45%; animation-delay: 4s; }
    .particle4 { width: 4px; height: 4px; top: 55%; left: 80%; animation-delay: 1s; }
    .particle5 { width: 7px; height: 7px; top: 75%; left: 10%; animation-delay: 3s; }

    /* ---------- Mobile Responsive ---------- */
    @media (max-width: 480px) {
      .popup {
        max-width: 300px;
        padding: 24px 20px 35px;
        bottom: 20px;
      }
      h1 { font-size: 22px; }
      .welcome-msg {
        font-size: 14px;
        margin-bottom: 8px;
      }
      p {
        font-size: 13px;
        margin-bottom: 20px;
      }
      .btn {
        width: 220px;
        font-size: 14px;
        padding: 14px 0;
        border-width: 2.5px;
      }
      .btn:nth-child(1) {
        animation: slideInScale 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) 1.2s both;
      }
      .btn:nth-child(2) {
        animation: slideInScale 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) 1.6s both;
      }
      .neon-particle { display: none; }
      .star {
        width: 1.5px !important;
        height: 1.5px !important;
      }
    }
  </style>
</head>
<body>
  <!-- Stars in Background -->
  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>

  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>

  <!-- Neon ambient glow particles -->
  <div class="neon-particle particle1"></div>

  <!-- Popup Card -->
  <div class="popup">
    <h1>🚀 Supreme AI</h1>

    <div class="button-container">
      <a href="https://sadiq9869.github.io/login.html" class="btn login">Login</a>

    </div>
  </div>
</body>
