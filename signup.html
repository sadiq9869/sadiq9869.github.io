<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supreme AI Signup - Animated</title>
<style>
  body {
    background: #0a0f1f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    margin: 0;
    overflow: hidden;
  }
  .container {
    background: rgba(255, 255, 255, 0.05);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    width: 320px;
    box-shadow: 0 0 20px rgba(255,255,255,0.1);
    animation: fadeInUp 0.8s ease-out;
  }
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  h1 {
    margin-bottom: 10px;
    font-size: 18px;
    font-weight: bold;
    animation: glowText 5s infinite alternate;
  }
  @keyframes glowText {
    0% { text-shadow: 0 0 5px #4a90e2; }
    100% { text-shadow: 0 0 20px #4a90e2; }
  }
  p.create-account {
    margin-bottom: 15px;
    font-size: 30px;
    font-weight: normal;
    color: white;
    white-space: nowrap;
    animation: fadeIn 1s ease-out 0.3s both;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .email-wrapper {
    position: relative;
    margin-bottom: 10px;
    width: 100%;
    height: 45px;
  }
  .email-wrapper input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border: 2px solid #aaa;
    border-radius: 25px;
    outline: none;
    font-size: 16px;
    background: transparent;
    color: white;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .email-wrapper input:focus {
    box-shadow: 0 0 10px #4a90e2;
  }
  .placeholder {
    position: absolute;
    top: 50%;
    left: 20px;
    transform: translateY(-50%);
    color: #aaa;
    font-size: 16px;
    pointer-events: none;
    transition: all 0.4s ease;
  }
  .email-wrapper.focused .placeholder,
  .email-wrapper.filled .placeholder {
    top: 0%;
    left: 20px;
    transform: translateY(-50%) scale(0.85);
    background: #0a0f1f;
    padding: 0 5px;
    color: #4a90e2;
  }
  .email-wrapper.focused input {
    border-color: #4a90e2;
  }
  .continue-btn {
    background: linear-gradient(90deg, #8b5cf6, #3b82f6);
    border: none;
    padding: 9px 10px;
    width: 100%;
    border-radius: 30px;
    cursor: pointer;
    color: white;
    font-size: 16px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 15px;
    transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .continue-btn:hover {
    transform: translateY(-4px) scale(1.08);
    box-shadow: 0 8px 20px rgba(139, 92, 246, 0.6);
    background: linear-gradient(90deg, #a78bfa, #60a5fa);
  }
  .continue-btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 300%;
    height: 300%;
    background: rgba(255, 255, 255, 0.1);
    transform: translate(-50%, -50%) rotate(45deg);
    transition: width 0.4s ease;
  }
  .continue-btn:hover::before {
    width: 0;
  }
  .login-link {
    font-size: 14px;
    margin-bottom: 20px;
  }
  .login-link a {
    color: #4a90e2;
    text-decoration: none;
  }
  .divider {
    display: flex;
    align-items: center;
    color: #aaa;
    margin: 20px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid #555;
  }
  .divider:not(:empty)::before {
    margin-right: .75em;
  }
  .divider:not(:empty)::after {
    margin-left: .75em;
  }
  .social-btn {
    background: white;
    color: black;
    padding: 10px 60px 10px 10px;
    border-radius: 70px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    cursor: pointer;
    font-weight: bold;
    gap: 10px;
    border: none;
    outline: none;
    width: 100%;
    margin-bottom: 10px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .social-btn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 5px 15px rgba(255,255,255,0.3);
  }
  .social-btn img {
    width: 20px;
    height: 20px;
  }
  .terms {
    font-size: 12px;
    color: #aaa;
    margin-top: 20px;
  }
  .terms a {
    color: #aaa;
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Supreme AI</h1>
    <p class="create-account">Create an account</p>
    <div class="email-wrapper">
      <input type="email" id="email">
      <span class="placeholder">Email address</span>
    </div>
    <button class="continue-btn">Continue</button>
    <p class="login-link">Already have an account? <a href="#">Log in</a></p>
    <div class="divider">OR</div>
    <button class="social-btn">
      <img src="https://cdn-icons-png.flaticon.com/512/483/483947.png" alt="Phone">
      Continue with phone
    </button>
    <button class="social-btn">
      <img src="https://img.icons8.com/?size=100&id=17949&format=png&color=000000" alt="Google Logo">
      Continue with Google
    </button>
    <button class="social-btn">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" alt="Microsoft Logo">
      Continue with Microsoft Account
    </button>
    <button class="social-btn">
      <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub Logo">
      Continue with GitHub
    </button>
    <div class="terms">
      <a href="#">Terms of Use</a> | <a href="#">Privacy Policy</a>
    </div>
  </div>
<script>
  const emailInput = document.getElementById('email');
  const wrapper = document.querySelector('.email-wrapper');

  emailInput.addEventListener('focus', () => {
    wrapper.classList.add('focused');
  });

  emailInput.addEventListener('blur', () => {
    wrapper.classList.remove('focused');
    if (emailInput.value.trim() !== '') {
      wrapper.classList.add('filled');
    } else {
      wrapper.classList.remove('filled');
    }
  });
</script>
</body>
</html>
