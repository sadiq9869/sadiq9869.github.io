<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supreme AI Signup - Animated</title>
<style>
  body {
    background: #0a0f1f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
  }

  .container {
    background: #11182f;
    padding: 30px;
    border-radius: 12px;
    width: 350px;
    text-align: center;
  }

  h2 {
    margin-bottom: 20px;
    color: #4da3ff;
  }

  .email-wrapper {
    position: relative;
    text-align: left;
    margin-bottom: 15px;
  }

  .email-label {
    color: #4da3ff;
    font-size: 14px;
    display: block;
    margin-bottom: 5px;
    transition: color 0.3s ease;
  }

  .email-wrapper.error .email-label {
    color: red;
  }

  input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 2px solid #4da3ff;
    background: #0a0f1f;
    color: white;
    outline: none;
    transition: border-color 0.3s ease;
  }

  .error-border {
    border-color: red !important;
  }

  .error-message {
    color: red;
    font-size: 13px;
    margin-top: 5px;
  }

  button {
    background: #4da3ff;
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    transition: background 0.3s ease;
  }

  button:hover {
    background: #368fe0;
  }
</style>
</head>
<body>
  <div class="container">
    <h2>Supreme AI Signup</h2>
    <div class="email-wrapper" id="emailWrapper">
      <label class="email-label">Email address</label>
      <input type="email" id="emailInput" placeholder="Enter your email">
    </div>
    <button id="continueBtn">Continue</button>
  </div>

<script>
  const emailInput = document.getElementById("emailInput");
  const continueBtn = document.getElementById("continueBtn");
  const wrapper = document.getElementById("emailWrapper");

  continueBtn.addEventListener("click", () => {
    const emailValue = emailInput.value.trim();
    const existingError = wrapper.querySelector(".error-message");
    if (existingError) existingError.remove();

    let errorText = "";
    if (!emailValue) {
      errorText = "Please enter your email address.";
    } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValue)) {
      errorText = "Please enter a valid email address.";
    }

    if (errorText) {
      emailInput.classList.add("error-border");
      wrapper.classList.add("error"); // Make label red
      const errorDiv = document.createElement("div");
      errorDiv.className = "error-message";
      errorDiv.textContent = errorText;
      wrapper.appendChild(errorDiv);
    } else {
      wrapper.classList.remove("error");
      emailInput.classList.remove("error-border");
    }
  });

  emailInput.addEventListener("input", () => {
    emailInput.classList.remove("error-border");
    wrapper.classList.remove("error");
    const existingError = wrapper.querySelector(".error-message");
    if (existingError) existingError.remove();
  });
</script>
</body>
</html>
