<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supreme AI - Reset Password</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
<style>
  body {
    background: #0a0f1f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    margin: 0;
    overflow: hidden;
  }
  .container {
    background: rgba(255, 255, 255, 0.05);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    width: 320px;
    box-shadow: 0 0 20px rgba(255,255,255,0.1);
    animation: fadeInUp 0.8s ease-out;
    position: relative;
    overflow: hidden;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  h1 {
    margin-bottom: 25px;
    font-size: 14px;
    font-weight: bold;
    animation: glowText 5s infinite alternate;
  }
  @keyframes glowText {
    0% { text-shadow: 0 0 5px #4a90e2; }
    100% { text-shadow: 0 0 20px #4a90e2, 0 0 30px #60a5fa; }
  }
  p.reset-prompt {
    margin-bottom: 15px;
    font-size: 22px;
    font-weight: 800;
    color: white;
    white-space: wrap;
    animation: fadeIn 0.8s ease-out 0.3s both;
    letter-spacing: 0.3px;
    text-shadow: 0 0 5px rgba(74, 144, 226, 0.5);
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .email-wrapper, .password-wrapper, .confirm-password-wrapper {
    position: relative;
    margin-bottom: 10px;
    width: 100%;
    height: auto;
  }
  .email-wrapper input, .password-wrapper input, .confirm-password-wrapper input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border: 2px solid #aaa;
    border-radius: 25px;
    outline: none;
    font-size: 16px;
    background: transparent;
    color: white;
    transition: all 0.4s ease;
  }
  .email-wrapper input:focus, .password-wrapper input:focus, .confirm-password-wrapper input:focus {
    box-shadow: 0 0 12px rgba(74, 144, 226, 0.7);
    border-color: #60a5fa;
    transform: scale(1.02);
  }
  .error-label {
    color: #ff4d4d !important;
  }
  .placeholder {
    position: absolute;
    top: 50%;
    left: 20px;
    transform: translateY(-50%);
    color: #aaa;
    font-size: 16px;
    pointer-events: none;
    transition: all 0.4s ease;
  }
  .email-wrapper.filled .placeholder,
  .password-wrapper.focused .placeholder,
  .password-wrapper.filled .placeholder,
  .confirm-password-wrapper.focused .placeholder,
  .confirm-password-wrapper.filled .placeholder {
    top: 0%;
    left: 20px;
    transform: translateY(-50%) scale(0.85);
    background: #0a0f1f;
    padding: 0 5px;
    color: #60a5fa;
  }
  .password-wrapper.invalid .placeholder,
  .confirm-password-wrapper.invalid .placeholder {
    color: #ff4d4d;
  }
  .password-wrapper.focused input,
  .confirm-password-wrapper.focused input {
    border-color: #60a5fa;
  }
  .password-wrapper.invalid input,
  .confirm-password-wrapper.invalid input {
    border-color: #ff4d4d;
  }
  .eye-icon {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #aaa;
    cursor: pointer;
    transition: color 0.3s ease, transform 0.3s ease;
    z-index: 1;
  }
  .eye-icon:hover {
    color: #60a5fa;
    transform: translateY(-50%) scale(1.2);
  }
  .password-wrapper.focused .eye-icon,
  .password-wrapper.filled .eye-icon,
  .confirm-password-wrapper.focused .eye-icon,
  .confirm-password-wrapper.filled .eye-icon {
    color: #60a5fa;
  }
  .password-wrapper.invalid .eye-icon,
  .confirm-password-wrapper.invalid .eye-icon {
    color: #ff4d4d;
  }
  .password-rule {
    display: none;
    font-size: 12px;
    color: #aaa;
    text-align: left;
    margin-top: 5px;
    transition: all 0.3s ease;
    animation: bounceIn 0.5s ease-out;
  }
  .password-rule.valid {
    color: #28a745;
  }
  .password-rule.invalid {
    color: #ff4d4d;
  }
  @keyframes bounceIn {
    0% { opacity: 0; transform: translateY(15px); }
    60% { opacity: 1; transform: translateY(-5px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .continue-btn {
    background: linear-gradient(90deg, #8b5cf6, #3b82f6);
    border: none;
    padding: 10px;
    width: 100%;
    border-radius: 30px;
    cursor: pointer;
    color: white;
    font-size: 16px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 15px;
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
  }
  .continue-btn:hover {
    transform: translateY(-4px) scale(1.08);
    box-shadow: 0 8px 20px rgba(139, 92, 246, 0.8);
    background: linear-gradient(90deg, #a78bfa, #60a5fa);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.8); }
    70% { box-shadow: 0 0 0 15px rgba(139, 92, 246, 0); }
    100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
  }
  .continue-btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 300%;
    height: 300%;
    background: rgba(255, 255, 255, 0.15);
    transform: translate(-50%, -50%) rotate(45deg);
    transition: width 0.4s ease;
  }
  .continue-btn:hover::before {
    width: 0;
  }
  .error-message {
    display: flex;
    align-items: center;
    color: #ff4d4d;
    font-size: 14px;
    margin-top: 5px;
    gap: 6px;
    animation: shake 0.4s ease, fadeIn 0.3s ease-in;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-5px); }
    40%, 80% { transform: translateX(5px); }
  }
  .error-icon {
    background: #ff4d4d;
    color: white;
    border-radius: 50%;
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 12px;
  }
  .error-border {
    border-color: #ff4d4d !important;
    box-shadow: 0 0 6px #ff4d4d !important;
    animation: shake 0.4s ease;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(0, 0, 0, 0.8);
    color: white;
    padding: 10px 20px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 1000;
    opacity: 1;
    transition: opacity 0.5s ease;
  }
  .toast.success { background: #28a745; }
  .toast.error { background: #ff4d4d; }
  .toast.fade-out { opacity: 0; }
</style>
</head>
<body>
  <div class="container">
    <h1>Supreme AI</h1>
    <p class="reset-prompt">Set a New Password</p>
    <div class="email-wrapper filled">
      <input type="email" id="reset-email" readonly>
      <span class="placeholder">Email address</span>
    </div>
    <div class="password-wrapper">
      <input type="password" id="new-password">
      <span class="placeholder">New Password</span>
      <span class="eye-icon fas fa-eye"></span>
      <div class="password-rule" id="password-rule">Password must be at least 8 characters.</div>
    </div>
    <div class="confirm-password-wrapper">
      <input type="password" id="confirm-password">
      <span class="placeholder">Confirm Password</span>
      <span class="eye-icon fas fa-eye"></span>
      <div class="password-rule" id="confirm-password-rule">Passwords must match.</div>
    </div>
    <button class="continue-btn" id="reset-btn">Confirm</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getAnalytics, logEvent as firebaseLogEvent } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyBmQyMu-Va-Mo3utQStaz3shbxWDyIK5qw",
      authDomain: "supreme-ai.firebaseapp.com",
      projectId: "supreme-ai",
      storageBucket: "supreme-ai.firebasestorage.app",
      messagingSenderId: "586558875086",
      appId: "1:586558875086:web:328051e411d2b76deeb79f",
      measurementId: "G-BV6KDTHHP7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const analytics = getAnalytics(app);

    // Configuration
    const validationConfig = {
      minPasswordLength: 8,
      resetEmailKey: "emailForReset",
      resetTokenCollection: "resetTokens"
    };

    // UI Elements
    const emailInput = document.getElementById('reset-email');
    const newPasswordInput = document.getElementById('new-password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const newPasswordWrapper = document.querySelector('.password-wrapper');
    const confirmPasswordWrapper = document.querySelector('.confirm-password-wrapper');
    const newPasswordPlaceholder = newPasswordWrapper.querySelector('.placeholder');
    const confirmPasswordPlaceholder = confirmPasswordWrapper.querySelector('.placeholder');
    const newPasswordRule = document.getElementById('password-rule');
    const confirmPasswordRule = document.getElementById('confirm-password-rule');
    const newEyeIcon = newPasswordWrapper.querySelector('.eye-icon');
    const confirmEyeIcon = confirmPasswordWrapper.querySelector('.eye-icon');
    const resetBtn = document.getElementById('reset-btn');

    // Pre-fill email
    let email = localStorage.getItem(validationConfig.resetEmailKey);
    if (!email) {
      email = window.prompt("Apna email confirm karo, bhai!");
    }
    if (email) {
      emailInput.value = email;
      emailInput.parentElement.classList.add('filled');
    }

    // Focus/Blur/Input for New Password
    newPasswordInput.addEventListener('focus', () => {
      newPasswordWrapper.classList.add('focused');
      newPasswordRule.style.display = 'block';
    });
    newPasswordInput.addEventListener('blur', () => {
      newPasswordWrapper.classList.remove('focused');
      if (newPasswordInput.value.trim() === '') {
        newPasswordWrapper.classList.remove('filled', 'invalid');
        newPasswordRule.style.display = 'none';
      } else {
        newPasswordWrapper.classList.add('filled');
      }
    });
    newPasswordInput.addEventListener('input', () => {
      const existingError = newPasswordWrapper.querySelector('.error-message');
      if (existingError) existingError.remove();
      newPasswordInput.classList.remove('error-border');
      newPasswordPlaceholder.classList.remove('error-label');

      const passwordValue = newPasswordInput.value.trim();
      newPasswordRule.style.display = 'block';
      if (passwordValue.length === 0) {
        newPasswordWrapper.classList.remove('invalid');
        newPasswordRule.classList.remove('valid', 'invalid');
      } else if (passwordValue.length < 8) {
        newPasswordWrapper.classList.add('invalid');
        newPasswordRule.classList.remove('valid');
        newPasswordRule.classList.add('invalid');
      } else {
        newPasswordWrapper.classList.remove('invalid');
        newPasswordRule.classList.remove('invalid');
        newPasswordRule.classList.add('valid');
      }
      validateConfirmPassword();
    });

    // Focus/Blur/Input for Confirm Password
    confirmPasswordInput.addEventListener('focus', () => {
      confirmPasswordWrapper.classList.add('focused');
      confirmPasswordRule.style.display = 'block';
    });
    confirmPasswordInput.addEventListener('blur', () => {
      confirmPasswordWrapper.classList.remove('focused');
      if (confirmPasswordInput.value.trim() === '') {
        confirmPasswordWrapper.classList.remove('filled', 'invalid');
        confirmPasswordRule.style.display = 'none';
      } else {
        confirmPasswordWrapper.classList.add('filled');
      }
    });
    confirmPasswordInput.addEventListener('input', () => validateConfirmPassword());

    // Eye Icon Toggle for New Password
    newEyeIcon.addEventListener('click', () => {
      const type = newPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      newPasswordInput.setAttribute('type', type);
      newEyeIcon.classList.toggle('fa-eye');
      newEyeIcon.classList.toggle('fa-eye-slash');
    });

    // Eye Icon Toggle for Confirm Password
    confirmEyeIcon.addEventListener('click', () => {
      const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      confirmPasswordInput.setAttribute('type', type);
      confirmEyeIcon.classList.toggle('fa-eye');
      confirmEyeIcon.classList.toggle('fa-eye-slash');
    });

    // Helper Functions
    function validatePassword(pwd) {
      if (!pwd) return "Password is required.";
      if (pwd.length < 8) return "Password must be at least 8 characters.";
      return "";
    }

    function validateConfirmPassword() {
      const existingError = confirmPasswordWrapper.querySelector('.error-message');
      if (existingError) existingError.remove();
      confirmPasswordInput.classList.remove('error-border');
      confirmPasswordPlaceholder.classList.remove('error-label');

      const newPasswordValue = newPasswordInput.value.trim();
      const confirmPasswordValue = confirmPasswordInput.value.trim();
      confirmPasswordRule.style.display = 'block';
      if (confirmPasswordValue.length === 0) {
        confirmPasswordWrapper.classList.remove('invalid');
        confirmPasswordRule.classList.remove('valid', 'invalid');
      } else if (confirmPasswordValue !== newPasswordValue) {
        confirmPasswordWrapper.classList.add('invalid');
        confirmPasswordRule.classList.remove('valid');
        confirmPasswordRule.classList.add('invalid');
      } else {
        confirmPasswordWrapper.classList.remove('invalid');
        confirmPasswordRule.classList.remove('invalid');
        confirmPasswordRule.classList.add('valid');
      }
    }

    function clearPasswordErrors() {
      const existingNewError = newPasswordWrapper.querySelector(".error-message");
      if (existingNewError) existingNewError.remove();
      newPasswordInput.classList.remove("error-border");
      newPasswordPlaceholder.classList.remove("error-label");
      const existingConfirmError = confirmPasswordWrapper.querySelector(".error-message");
      if (existingConfirmError) existingConfirmError.remove();
      confirmPasswordInput.classList.remove("error-border");
      confirmPasswordPlaceholder.classList.remove("error-label");
    }

    function showPasswordError(wrapper, input, placeholder, message) {
      input.classList.add("error-border");
      placeholder.classList.add("error-label");
      const errorDiv = document.createElement("div");
      errorDiv.className = "error-message";
      errorDiv.innerHTML = `<span class="error-icon">!</span> ${message}`;
      wrapper.appendChild(errorDiv);
    }

    function showToast(type, message) {
      const existingToast = document.querySelector(".toast");
      if (existingToast) existingToast.remove();
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.setAttribute("role", "alert");
      toast.innerHTML = `<span class="toast-icon">${type === "success" ? "✅" : "❌"}</span> ${message}`;
      document.body.appendChild(toast);
      setTimeout(() => toast.classList.add("fade-out"), 4500);
      setTimeout(() => toast.remove(), 5000);
    }

    function showSuccess(msg) { showToast("success", msg); }
    function showError(msg) { showToast("error", msg); }

    function setLoadingState(button, isLoading, loadingText, defaultText) {
      button.disabled = isLoading;
      button.innerText = isLoading ? loadingText : defaultText;
      button.classList.toggle("loading", isLoading);
    }

    function logEvent(eventName, payload = {}) {
      console.log(`[Analytics] ${eventName}`, payload);
      firebaseLogEvent(analytics, eventName, payload);
    }

    // Reset Password Logic with Token
    resetBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      const newPassword = newPasswordInput.value.trim();
      const confirmPassword = confirmPasswordInput.value.trim();
      clearPasswordErrors();
      setLoadingState(resetBtn, true, "Resetting...", "Confirm");

      const validationError = validatePassword(newPassword);
      if (validationError) {
        showPasswordError(newPasswordWrapper, newPasswordInput, newPasswordPlaceholder, validationError);
        setLoadingState(resetBtn, false, "Resetting...", "Confirm");
        return;
      }
      if (newPassword !== confirmPassword) {
        showPasswordError(confirmPasswordWrapper, confirmPasswordInput, confirmPasswordPlaceholder, "Passwords do not match!");
        setLoadingState(resetBtn, false, "Resetting...", "Confirm");
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const tokenFromUrl = urlParams.get('token');

      if (!tokenFromUrl) {
        showError("Link galat ya missing hai!");
        logEvent("reset_password_error", { error: "Missing token" });
        setLoadingState(resetBtn, false, "Resetting...", "Confirm");
        return;
      }

      const tokenRef = doc(db, validationConfig.resetTokenCollection, tokenFromUrl);
      try {
        logEvent("reset_password_attempt", { email, timestamp: Date.now() });
        const tokenSnap = await getDoc(tokenRef);
        if (!tokenSnap.exists()) {
          showError("Link galat ya expire ho gaya!");
          logEvent("reset_token_invalid", { email, token: tokenFromUrl });
          setLoadingState(resetBtn, false, "Resetting...", "Confirm");
          return;
        }

        const tokenData = tokenSnap.data();
        if (tokenData.expiry.toMillis() < Date.now()) {
          await deleteDoc(tokenRef);
          showError("Link expire ho gaya. Dobara try kar!");
          logEvent("reset_token_expired", { email, token: tokenFromUrl });
          setLoadingState(resetBtn, false, "Resetting...", "Confirm");
          return;
        }

        if (tokenData.email !== email) {
          showError("Email match nahi karta!");
          logEvent("reset_email_mismatch", { email, token: tokenFromUrl });
          setLoadingState(resetBtn, false, "Resetting...", "Confirm");
          return;
        }

        // Update password
        await confirmPasswordReset(auth, tokenData.oobCode, newPassword);
        await deleteDoc(tokenRef);
        showSuccess("Password reset ho gaya! Login page pe ja raha hai...");
        logEvent("reset_password_success", { email, timestamp: Date.now() });
        localStorage.removeItem(validationConfig.resetEmailKey);
        setTimeout(() => window.location.href = "login.html", 3000);
      } catch (error) {
        showError(`Error: ${error.message}`);
        logEvent("reset_password_error", { email, error: error.message });
        setLoadingState(resetBtn, false, "Resetting...", "Confirm");
      }
    });
  </script>
</body>
</html>
